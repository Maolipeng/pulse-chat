name: whatsapp_flutter
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.2.2
  shared_preferences: ^2.2.3
  socket_io_client: ^2.0.3+1
  provider: ^6.1.2
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2
  flutter_webrtc: ^0.12.6

dev_dependencies:
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/pulsechat-icon.png

flutter:
  uses-material-design: true
